server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Security header layering note (H-13 verification)
    # -------------------------------------------------------------------------
    # The headers defined here apply ONLY to SPA static assets served by nginx.
    # Backend API responses (/api/*) get their own — stricter — headers via
    # actix's DefaultHeaders middleware in `server/src/server.rs:212-217`.
    # That middleware wraps actix-served responses exclusively; it has no
    # influence on files nginx serves directly.  The two sets of headers are
    # entirely independent.
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # Security headers — applied globally at the server level.
    #
    # NGINX add_header inheritance footgun: a location block that defines ANY
    # of its own add_header directives will NOT inherit the server-level ones.
    # To work around this, the two location blocks that set Cache-Control
    # (hashed assets, index.html) explicitly repeat every security header.
    # The `always` flag ensures headers are emitted on error responses too.
    # -------------------------------------------------------------------------

    # Content Security Policy — pragmatic profile (Phase 2).
    # 'unsafe-inline' in script-src is required by the pre-paint inline script
    # in index.html that reads localStorage and sets data-theme/data-accent
    # before first paint.  Tightening to a nonce/hash-based CSP is deferred to
    # Phase 3 (requires a build-time hash plugin).
    # style-src 'unsafe-inline' is required by Vue's runtime style injection and
    # Tailwind's class-based dynamic styles.
    # connect-src 'self' covers all /api/* XHR/fetch calls (same-origin via
    # nginx proxy).
    # frame-src covers the Google Sign-In iframe rendered by accounts.google.com.
    # Stripe Checkout is a full-page redirect via window.location.href; Stripe.js
    # is NOT embedded, so js.stripe.com is intentionally absent from CSP.
    # img-src 'self' https: data: is broad enough to cover AniList CDN images
    # without enumerating every possible AniList image hostname.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; form-action 'self' https://accounts.google.com; object-src 'none'; base-uri 'self';" always;

    # HSTS — 1-year max-age.  Per spec, browsers ignore this header on plain
    # HTTP connections, so it is harmless in HTTP-only local dev environments.
    # `preload` is deliberately omitted; preload-list submission is a separate
    # decision that cannot be undone without a long wait period.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy — deny all APIs the app does not use.
    # payment=() is safe: Stripe Checkout is a full-page redirect, not a
    # Payment Request API call, so denying the API does not break the flow.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # -------------------------------------------------------------------------
    # API proxy — must come before the SPA catch-all
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE-friendly proxy config (H-14).
        # Default proxy_buffering on + 60s proxy_read_timeout causes nginx to
        # buffer or drop text/event-stream frames before they reach the client.
        # These settings allow SSE connections to stay open and deliver frames
        # in real time.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # Empty Connection header prevents "hop-by-hop" header forwarding,
        # keeping the upstream connection in HTTP/1.1 keep-alive mode.
        proxy_set_header Connection "";
        # Disable chunked encoding so nginx emits raw SSE frame bytes without
        # re-chunking, which some clients mishandle on event-stream responses.
        chunked_transfer_encoding off;
    }

    # -------------------------------------------------------------------------
    # SPA routing — all unmatched paths serve index.html so vue-router handles
    # them client-side.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Cache-bust hashed assets aggressively.
    # Security headers are repeated here because this block's own add_header
    # directives would shadow the server-level ones (nginx inheritance rule).
    # -------------------------------------------------------------------------
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; form-action 'self' https://accounts.google.com; object-src 'none'; base-uri 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    }

    # -------------------------------------------------------------------------
    # Don't cache the root HTML (it references hashed assets).
    # Security headers are repeated here for the same inheritance reason.
    # -------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; form-action 'self' https://accounts.google.com; object-src 'none'; base-uri 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    }
}
