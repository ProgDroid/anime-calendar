name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Rust backend
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    # SQLX_OFFLINE=true uses the committed .sqlx/ query cache for compile-time
    # type-checking without requiring a live database. Run `cargo sqlx prepare
    # --workspace` locally (with DATABASE_URL set) and commit .sqlx/ when queries change.
    env:
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y nasm cmake

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check (type-check + sqlx offline query verification)
        run: cargo check --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Format check
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # Vue / TypeScript frontend
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # OpenAPI spec validation
  # ---------------------------------------------------------------------------
  openapi:
    name: OpenAPI Validation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml --format=summary
