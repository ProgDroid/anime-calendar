name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Rust backend
  #
  # SQLX_OFFLINE=true uses the committed .sqlx/ query cache for compile-time
  # macro verification (no live DB needed for compilation). Regenerate locally
  # with `cargo sqlx prepare --workspace -- --all-targets` after any query
  # change — the `--all-targets` is required so test-module queries get cached.
  #
  # Postgres + Redis run as services so the integration / mapper / cache tests
  # can connect at runtime. Migrations are applied before tests via sqlx-cli.
  #
  # Speed wins vs the previous layout:
  #   - dropped redundant `cargo check` (clippy --all-targets is a superset)
  #   - lld linker via RUSTFLAGS (faster relinks)
  #   - cargo-nextest for parallel test execution
  #   - CARGO_INCREMENTAL=0 keeps the Swatinem cache compact for better hits
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anime_calendar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SQLX_OFFLINE: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/anime_calendar
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C link-arg=-fuse-ld=lld

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install system dependencies (nasm for aws-lc-sys, lld for fast linking)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y nasm cmake lld

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          components: clippy, rustfmt
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Install cargo-nextest + sqlx-cli (prebuilt binaries)
        uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb
        with:
          tool: cargo-nextest,sqlx-cli

      - name: Run database migrations
        run: sqlx migrate run

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings) — also type-checks all targets including tests
        run: cargo clippy --workspace --all-targets -- -W clippy::all -W clippy::pedantic -W clippy::nursery -A clippy::missing_docs_in_private_items -A clippy::separated_literal_suffix -A clippy::implicit_return -A clippy::print_stderr -A clippy::exhaustive_enums -A clippy::exhaustive_structs -A clippy::single_char_lifetime_names -A clippy::missing_inline_in_public_items -A clippy::self_named_module_files -A clippy::wildcard_enum_match_arm -A clippy::pattern_type_mismatch -A clippy::std-instead-of-core

      - name: Tests (cargo nextest)
        run: cargo nextest run --workspace --all-targets

  # ---------------------------------------------------------------------------
  # Vue / TypeScript frontend
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Vue / TypeScript frontend — Playwright e2e (mobile)
  # ---------------------------------------------------------------------------
  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-24.04
    needs: frontend

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw-version
        shell: bash
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright browsers + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit firefox

      - name: Run e2e (mobile, 3 engines)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Dependency advisory, license, and supply-chain checks
  #
  # Uses cargo-deny with deny.toml at the repo root.
  # All four checks run: advisories, bans, licenses, sources.
  # Currently-known advisories are listed in [advisories.ignore] in deny.toml
  # with Phase 3 comments — new advisories fail CI immediately.
  # ---------------------------------------------------------------------------
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # v2.0.17
      - uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb
        with:
          command: check
          arguments: --all-features --show-stats

  # ---------------------------------------------------------------------------
  # OpenAPI spec validation
  #
  # The spec is generated at CI time from the utoipa annotations on the server
  # crate (see server/src/openapi.rs and server/src/bin/openapi-export.rs).
  # No spec file is committed — the binary is the single source of truth.
  # ---------------------------------------------------------------------------
  openapi:
    name: OpenAPI Validation
    runs-on: ubuntu-24.04

    env:
      SQLX_OFFLINE: true
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C link-arg=-fuse-ld=lld

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install system dependencies (nasm for aws-lc-sys, lld for fast linking)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y nasm cmake lld

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'

      - name: Generate OpenAPI spec
        run: cargo run --quiet --bin openapi-export > openapi.json

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli@2.30.4 lint openapi.json --format=summary
