query GetItems($ids: [Int!]!) {
    # perPage must match MAX_IDS_PER_REQUEST in src/client.rs. AniList's
    # default page size is 25 (max 50); without this, requests with >25 ids
    # silently dropped the overflow.
    Page(perPage: 50) {
        media(id_in: $ids) {
            id
            idMal
            title {
                romaji
                english
                native
            }
            duration
            airingSchedule(notYetAired: true) {
                nodes {
                    id
                    airingAt
                    episode
                }
            }
            mediaType: type
            coverImage {
                extraLarge
                large
                medium
                color
            }
            bannerImage
            recommendations(sort: RATING_DESC, page: 1, perPage: 5) {
                edges {
                    node {
                        rating
                        mediaRecommendation {
                            id
                            idMal
                            title {
                                romaji
                                english
                                native
                            }
                            coverImage {
                                extraLarge
                                large
                                medium
                                color
                            }
                        }
                    }
                }
            }
        }
    }
}
