query GetItems($ids: [Int!]!) {
    Page {
        media(id_in: $ids) {
            id
            idMal
            title {
                romaji
                english
                native
            }
            duration
            airingSchedule(notYetAired: true) {
                nodes {
                    id
                    airingAt
                    episode
                }
            }
            mediaType: type
            coverImage {
                extraLarge
                large
                medium
                color
            }
            bannerImage
        }
    }
}
