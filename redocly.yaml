extends:
  - recommended

# Tuning notes:
#
# The OpenAPI spec is auto-generated by utoipa from `#[utoipa::path]`
# annotations on the actix-web handlers (see `server/src/openapi.rs` and
# `server/src/bin/openapi-export.rs`). Some redocly rules expect human-
# authored prose or structural choices that don't map cleanly to a
# code-derived spec — those are turned off here. Genuine drift signals
# (duplicate operationIds, ambiguous schemas, broken refs) stay on.
rules:
  # utoipa derives `summary` from the first line of a `///` doc comment on
  # the handler. We don't currently doc-comment all 28 handlers and don't
  # want to require it as a CI gate — the operation tag + path are enough
  # to identify each operation.
  operation-summary: off

  # Public endpoints (login, register, refresh, password reset, OAuth) are
  # intentionally unauthenticated. Declaring root-level `security` would
  # require per-operation `security(())` overrides on every public handler.
  # The server enforces auth via the actix middleware, not the spec.
  security-defined: off

  # 4xx response shape varies per handler. Worth knowing about, not worth
  # blocking CI on.
  operation-4xx-response: off

  # `/calendars/subscribe/{token}` and `/calendars/{id}/export` are
  # disambiguated at the actix-web routing layer (the literal `subscribe`
  # is matched before `{id}`). The OpenAPI ambiguity warning is theoretical.
  no-ambiguous-paths: off
