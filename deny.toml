# Configuration for cargo-deny — supply-chain + license + advisory checks.
# Run locally: `cargo deny check`
# CI: see .github/workflows/ci.yml job `cargo-deny`.

[graph]
# Targets the project actually builds for. Restricting reduces noise from
# platform-specific dependencies that are never compiled in practice.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
# Ignore current advisories that we've consciously deferred to Phase 3.
# Format: ignore = ["RUSTSEC-YYYY-XXXX"]  — one per line, ALWAYS with a comment.
# When a new advisory appears, CI fails — DO NOT add to this list without
# filing a corresponding Phase 3 entry in AUDIT.md.
ignore = [
  # rsa 0.9.x — Marvin Attack: potential key recovery through timing sidechannels
  # Affected dep: google-oauth → rsa. No safe upgrade available yet (tracked upstream).
  # Workaround: not exploitable for our use (Google ID token verification, not RSA decrypt path)
  "RUSTSEC-2023-0071",
]
# 2026-06-11 follow-up audit: the 12 previously-deferred advisories were resolved by
# `cargo update -p lettre -p rustls-webpki -p bytes -p time -p rand@0.9.2 -p aws-lc-rs`
# (aws-lc-sys 0.41.0, rustls-webpki 0.103.13, bytes 1.11.1, time 0.3.47, rand 0.9.4,
# lettre 0.11.22). Note: RUSTSEC-2026-0007 was `bytes`, RUSTSEC-2026-0009 was `time` —
# the original AUDIT.md CD-6/CD-7 entries had the two IDs swapped.

[licenses]
version = 2
# Broadly-permissive licenses we ALWAYS accept project-wide.
# Anything narrower (or per-crate special cases) goes in [[licenses.exceptions]] below
# so a future `cargo add` of a crate with a less-common license fails CI loudly.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "OpenSSL",
]
confidence-threshold = 0.93

# Skip license checks for unpublished workspace-private crates (server, anilist, common).
# These crates have publish = false and are internal-only; they carry no third-party license risk.
[licenses.private]
ignore = true

# Per-crate license overrides for crates with non-SPDX or unconventional
# license declarations. Each exception is single-crate scoped — adding a NEW
# crate that uses one of these licenses will fail CI until explicitly listed.
[[licenses.exceptions]]
# BSL-1.0 (Boost): transitive dep of redis crate.
allow = ["BSL-1.0"]
crate = "xxhash-rust"

[[licenses.exceptions]]
# 0BSD: transitive dep of lettre (SMTP MIME encoding).
allow = ["0BSD"]
crate = "quoted_printable"

[[licenses.exceptions]]
# CDLA-Permissive-2.0: transitive dep of hyper-rustls (TLS root certificates).
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"

[bans]
multiple-versions = "warn"
# Suppress the wildcard error for workspace path dependencies (anilist, common).
# These are internal crates with no version pinning needed.
wildcards = "allow"
highlight = "all"
skip-tree = []

# Crates we explicitly deny (e.g. unmaintained, replaced).
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies in this project.
allow-git = []
