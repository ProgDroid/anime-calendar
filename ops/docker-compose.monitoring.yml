name: anime-calendar-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ac-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"  # host 9091 -> container 9090; avoids clash with app metrics port
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ac-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Default admin/admin is acceptable ONLY because the port is bound to
      # 127.0.0.1 above (loopback-only dev monitoring). For any non-loopback or
      # production exposure, override GF_SECURITY_ADMIN_PASSWORD with a secret
      # (e.g. __FILE/_FILE env or a Docker secret) before deploying (L-16).
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  redis_exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: ac-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://host.docker.internal:6379"
    ports:
      - "127.0.0.1:9121:9121"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prometheus_data:
  grafana_data:
