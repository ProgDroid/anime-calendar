global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: anime-calendar

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: anime-calendar-server
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          component: server

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis_exporter:9121"]
        labels:
          component: redis
