services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: anime-calendar
      POSTGRES_USER: anime-calendar
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      # 127.0.0.1 binding: dev-only DB exposure to localhost. Production deployments use a private network and should not expose this port at all.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime-calendar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      # 127.0.0.1 binding: dev-only Redis exposure to localhost. Production deployments use a private network and should not expose this port at all.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
      - ./database.docker.toml:/app/database.toml:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No build args. Public bootstrap config (Google OAuth client ID, etc.)
      # is delivered at runtime by the backend via GET /api/public-config,
      # so the resulting image is environment-agnostic.
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
