[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
actix-cors = "0.7"
# `http2` is deliberately excluded from the default feature set. The server binds
# with plain `HttpServer::bind()`, and actix-web selects HTTP/2 only via ALPN on
# `bind_rustls()`/`bind_openssl()` or via the opt-in `bind_auto_h2c()` — neither of
# which this app uses, since TLS is terminated at nginx/Cloudflare and the upstream
# hop is HTTP/1.1. The h2 support was therefore compiled but unreachable, while
# pulling in h2 0.3.x, whose line ended at 0.3.27 with RUSTSEC-2026-0258
# (unbounded empty DATA frames) unpatched — the fix landed in 0.4.16 and
# actix-http 3.x requires `h2 ^0.3`, so no dependency update can clear it.
# Dropping the feature removes the crate from the graph entirely instead of
# ignoring the advisory. actix-cors, actix-web-lab and utoipa-swagger-ui all
# declare actix-web with `default-features = false`, so nothing re-enables it
# through feature unification.
# If HTTP/2 is ever needed at the origin, re-add the feature AND revisit the
# advisory — do not assume it is still unfixed.
actix-web = { version = "4.11", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
] }
governor = "0.10"
actix-web-lab = "0.24"
anilist = { path = "../anilist" }
argon2 = { version = "0.5", features = [ "std" ] }
async-stream = "0.3"
async-stripe = "=1.0.0-rc.5"
async-stripe-billing = { version = "=1.0.0-rc.5", features = ["subscription", "subscription_item", "billing_portal_session", "serialize", "deserialize"] }
async-stripe-checkout = { version = "=1.0.0-rc.5", features = ["checkout_session", "serialize", "deserialize"] }
async-stripe-core = { version = "=1.0.0-rc.5", features = ["customer", "serialize", "deserialize"] }
async-stripe-shared = { version = "=1.0.0-rc.5", features = ["serialize", "deserialize"] }
async-stripe-types = { version = "=1.0.0-rc.5", features = ["serialize", "deserialize"] }
async-stripe-webhook = { version = "=1.0.0-rc.5", features = ["deserialize", "async-stripe-checkout", "async-stripe-billing", "async-stripe-core"] }
chrono = { version = "0.4", features = [ "serde" ] }
common = { path = "../common", features = ["utoipa"] }
config = "0.15"
email_address = "0.2"
env_logger = "0.11"
futures = "0.3"
futures-util = "0.3"
google-oauth = { version = "1.11" }
icalendar = "0.17.3"
jsonwebtoken = { version = "10.2", features = [ "aws_lc_rs" ] }
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }
log = "0.4"
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
rand = "0.9"
# tokio-native-tls-comp is required for `rediss://` (managed Redis providers
# mandate TLS). It pulls in tls-native-tls, matching sqlx and lettre so the
# tree carries one TLS stack rather than adding rustls alongside it.
redis = { version = "1.0", features = [ "aio", "tokio-comp", "tokio-native-tls-comp" ] }
secrecy = { version = "0.10", features = [ "serde" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "postgres", "macros", "chrono", "migrate" ] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
utoipa = { version = "5", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"], optional = true }

[features]
# Serving the Swagger UI is a dev-only convenience (gated at runtime by
# `enable_docs`), but utoipa-swagger-ui downloads the Swagger UI archive from
# GitHub in its build script. That makes the whole crate unbuildable in any
# sandbox without egress to github.com. Keep it on by default so CI and local
# dev are unchanged, and build with --no-default-features where the download
# is unavailable or unwanted (including production images, which never set
# enable_docs = true).
default = ["swagger-ui"]
swagger-ui = ["dep:utoipa-swagger-ui"]

[dev-dependencies]
metrics-util = "0.20.1"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
