[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11"
anilist = { path = "../anilist" }
chrono = "0.4"
common = { path = "../common" }
config = "0.15"
env_logger = "0.11"
icalendar = "0.17.3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "postgres", "macros" ] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
