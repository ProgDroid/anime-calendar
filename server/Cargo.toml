[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7"
actix-web = "4.11"
actix-web-lab = "0.24"
anilist = { path = "../anilist" }
argon2 = { version = "0.5", features = [ "std" ] }
chrono = { version = "0.4", features = [ "serde" ] }
common = { path = "../common" }
config = "0.15"
env_logger = "0.11"
futures = "0.3"
futures-util = "0.3"
google-oauth = { version = "1.11" }
icalendar = "0.17.3"
jsonwebtoken = { version = "10.2", features = [ "aws_lc_rs" ] }
log = "0.4"
rand = "0.9"
redis = { version = "1.0", features = [ "aio", "tokio-comp" ] }
secrecy = { version = "0.10", features = [ "serde" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "postgres", "macros", "chrono" ] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
